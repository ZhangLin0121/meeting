# 统一 nginx 配置 - 管理多个服务（meeting / tenant 等）

# HTTP -> HTTPS 重定向
server {
    listen 80;
    server_name www.cacophonyem.me cacophonyem.me api.cacophonyem.me;
    return 301 https://www.cacophonyem.me$request_uri;
}

# 主站 HTTPS 配置
server {
    listen 443 ssl http2;
    server_name www.cacophonyem.me;

    # SSL 证书
    ssl_certificate /etc/letsencrypt/live/www.cacophonyem.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.cacophonyem.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # 通用配置
    client_max_body_size 10M;
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;
    include /etc/nginx/snippets/linpin-payroll.conf;

    # =========================
    # 会议室预订系统 (Meeting)
    # =========================
    location /meeting/api/ {
        proxy_pass http://localhost:3000/api/;  # meeting 后端监听 3000
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host www.ovc-talent.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /meeting/uploads/ {
        proxy_pass http://localhost:3000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host www.ovc-talent.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================
    # 租客管理系统 (Tenant)
    # =========================
    location /tenant/api/ {
        proxy_pass http://localhost:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host www.ovc-talent.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /tenant/assets/ {
        proxy_pass http://localhost:5001/assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /tenant/ {
        proxy_pass http://localhost:5001/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host www.ovc-talent.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # 打卡管理 (Check-in Admin)
    # =========================
    location = /checkin {
        return 301 /checkin/;
    }

    location /checkin/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host www.ovc-talent.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /checkin;
    }

    # =========================
    # 智能投诉自动回复系统 (Complaint Auto Reply)
    # =========================
    # 投诉系统凭据代理：凭据只存在服务器 /opt/complaint-proxy/.env（600）
    location /complaint-api/ {
        proxy_pass http://127.0.0.1:39002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    location /complaint/ {
        alias /var/www/html/complaint/;
        index index.html;
        try_files $uri $uri/ /complaint/index.html;
    }

    # =========================
    # OVC API ?? (Complaint)
    # =========================
    # =========================
    # 人才补贴处理 (person-import)
    # =========================
    location /person-import/ {
        proxy_pass http://127.0.0.1:8788/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        add_header X-Accel-Buffering no;
        client_max_body_size 20M;
    }

    location /ovc-api/ {
        proxy_pass https://www.ovc-talent.com/;
        proxy_http_version 1.1;
        proxy_set_header Host www.ovc-talent.com;
        proxy_set_header Origin https://www.ovc-talent.com;
        proxy_set_header Referer https://www.ovc-talent.com/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;

        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $ovc_cookie_header;
    }

    location /ovc/ {
        proxy_pass https://www.ovc-talent.com/;
        proxy_http_version 1.1;
        proxy_set_header Host www.ovc-talent.com;
        proxy_set_header Origin https://www.ovc-talent.com;
        proxy_set_header Referer https://www.ovc-talent.com/;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
    }

    # =========================
    # 租赁申请统一配置 (Shared Config)
    # =========================
    location /rent-applicants-config/ {
        proxy_pass http://127.0.0.1:39001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store";
    }


    # =========================
    # 合同收支管家 (contract-ledger) — Next.js on 3010
    # =========================
    location /contract-ledger {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50M;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        # 页面文档与接口一律回源校验，避免预渲染缓存导致"刷新后仍是旧版"
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
    }

    # Next 的 chunk 文件名在重新构建后可能不变、但内容会变；若沿用 upstream 的
    # immutable 一年缓存，浏览器会一直用旧 JS（表现为"刷新后没更新"）。
    # 改为 no-cache：浏览器仍缓存，但每次带 ETag 回源校验——未变 304，变了拿新内容。
    location /contract-ledger/_next/static/ {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-cache" always;
    }

    # =========================
    # 兼容性配置 (向后兼容)
    # =========================
    location /api/ {
        proxy_pass http://localhost:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host www.ovc-talent.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # =========================
    # 默认页面和代理
    # =========================
    # talent-summary stats panel (restored 2026-09-30)
    location /talent-summary/ {
        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    location / {
        root /var/www/html;
        index index.html;
        try_files $uri $uri/ @proxy;
    }

    location @proxy {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host www.ovc-talent.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    # =========================

}

# API 子域名（可选）
server {
    listen 443 ssl http2;
    server_name api.cacophonyem.me;

    ssl_certificate /etc/letsencrypt/live/www.cacophonyem.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.cacophonyem.me/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    client_max_body_size 10M;

    location /meeting/ {
        proxy_pass http://localhost:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host www.ovc-talent.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /tenant/ {
        proxy_pass http://localhost:5001/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host www.ovc-talent.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
